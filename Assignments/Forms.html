<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Survey</title>
    <link rel="stylesheet" href="Forms.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Mission Survey</h1>
    </header>

    <main>
        <h3>Help us keep track of mission information</h3>

        <form id="myform" novalidate>
            <fieldset>
                <legend>Account</legend>

                <div class="form-row">
                    <label for="personname">First name:</label>
                    <input id="personname" type="text" name="Fullname">
                </div>
                <div class="form-row">
                    <label for="personname">Middle name:</label>
                    <input id="personname" type="text" name="Fullname">

                <div class="form-row">
                    <label for="Lastname">Last name:</label>
                    <input id="Lastname" type="text" name="Lastname">
                </div>

                <div class="form-row">
                    <label for="state">State:</label>
                    <select name="State" id="state">
                        <option value="">Choose a state</option>
                        <option value="Tamilnadu">Tamilnadu</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Andhrapradesh">Andhrapradesh</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Telangana">Telangana</option>
                    </select>
                </div>

                <div class="form-row">
                    <span class="field-label">Gender:</span>
                    <div>
                        <label class="choice">
                            <input type="radio" name="Gender" value="Female">
                            Female
                        </label>
                        <label class="choice">
                            <input type="radio" name="Gender" value="Male">
                            Male
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="Missionstart">Mission start date:</label>
                    <input type="date" name="Missionstart" id="Missionstart">
                </div>

                <div class="form-row">
                    <label for="Missionends">Mission end date:</label>
                    <input type="date" name="Missionends" id="Missionends">
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" name="Email" id="email" placeholder="sample@gmail.com">
                </div>

                <div class="form-row">
                    <label for="Phone">Phone number:</label>
                    <input type="tel" name="Phone" id="Phone" placeholder="+1808608208">
                </div>

                <div class="form-row">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        name="Password"
                        id="password"
                        placeholder="At least 8 characters"
                    >
                </div>

                <div class="form-row">
                    <label for="Comments">Comments:</label>
                    <textarea name="Comments" id="Comments"></textarea>
                </div>

                <h4>Terms and conditions</h4>
                <p>Please confirm that you have read the terms.</p>

                <div class="form-row">
                    <span class="field-label"></span>
                    <label class="choice">
                        <input type="checkbox" name="Agree" value="Yes">
                        I agree to the terms and conditions
                    </label>
                </div>

                <div class="form-row">
                    <span class="field-label"></span>
                    <button type="submit">Submit</button>
                </div>

                <p id="message" role="status"></p>
            </fieldset>
        </form>
    </main>

    <footer>
        &copy; Rajini 2026
    </footer>
</body>
</html>
